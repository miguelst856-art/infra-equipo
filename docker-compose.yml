services:
  nginx:
    image: nginx:stable
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped

  apache:
    image: httpd:2.4
    ports:
      - "${APACHE_PORT:-8081}:80"
    volumes:
      - ./web:/usr/local/apache2/htdocs:ro
    restart: unless-stopped
